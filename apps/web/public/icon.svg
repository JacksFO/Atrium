<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Atrium">
  <!--
    The browser tab mark. SVG rather than a PNG so it stays crisp at any size
    and adapts to nothing - a favicon is drawn tiny and must survive it.

    Same palette as the app: a cyan-to-blue speech mark on near black.
  -->
  <defs>
    <linearGradient id="jc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3FE0E8"/>
      <stop offset="1" stop-color="#4C8DFF"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="#04070A"/>

  <!-- A speech bubble, tail bottom-left. Heavy strokes so it reads at 16px. -->
  <path
    d="M17 15h30a6 6 0 0 1 6 6v18a6 6 0 0 1-6 6H29l-11 9v-9h-1a6 6 0 0 1-6-6V21a6 6 0 0 1 6-6z"
    fill="url(#jc)"/>

  <!-- Three dots: legible at small sizes where finer detail disappears. -->
  <circle cx="24" cy="30" r="3.4" fill="#04070A"/>
  <circle cx="32" cy="30" r="3.4" fill="#04070A"/>
  <circle cx="40" cy="30" r="3.4" fill="#04070A"/>
</svg>
